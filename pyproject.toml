[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secrecy-mapper"
version = "0.1.0"
description = "An evidence-driven system for entity resolution and structural network analysis."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2,<4.0",
    "pandas>=2.1,<4.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["secrecy_mapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]

[tool.coverage.run]
source = ["secrecy_mapper"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
